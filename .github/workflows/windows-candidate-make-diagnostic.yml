name: Windows candidate make diagnostic

on:
  push:
    branches:
      - codex/issue-44-windows-candidate-diagnostic

jobs:
  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - id: install
        run: npm ci
      - if: always() && steps.install.outcome == 'success'
        run: npm test -- tests/server-network-boundary.test.ts
      - if: always() && steps.install.outcome == 'success'
        run: npm test -- tests/windows-process-host.test.ts -t "PATH-only executable"
      - if: always() && steps.install.outcome == 'success'
        run: npm test -- tests/validation-service.test.ts -t "declared all profile uses canonical make verify"
