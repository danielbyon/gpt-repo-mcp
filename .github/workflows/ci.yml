name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify issue-readiness guardrail
        run: npm run test:issue-readiness

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm test -- tests/tool-contracts.test.ts tests/mcp-contract.test.ts

      - name: V2 receipt mutation regressions
        run: npm test -- tests/validation-receipt-mutations.test.ts --reporter=verbose

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Public hygiene
        run: npm run check:public

      - name: Distribution build and health smoke
        run: npm run verify:dist

      - name: Whitespace check
        run: git diff --check

  windows-test:
    name: "Windows cancellation qualification / Node ${{ matrix.node-version }}"
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Verify issue-readiness guardrail
        run: npm run test:issue-readiness

      - name: Typecheck
        run: npm run typecheck

      - name: Build production package and Windows helper
        run: npm run build

      - name: V2 receipt mutation regressions
        run: npm test -- tests/validation-receipt-mutations.test.ts --reporter=verbose

      - name: Verify actual Windows npm package archive
        run: npm run verify:package-archive
      - name: Windows package archive inventory regression
        run: npm test -- tests/package-archive-verification.test.ts --reporter=verbose

      - name: Windows exact Node runtime and shell-free npm dispatch
        run: |
          npm test -- tests/node-runtime-resolver.test.ts --reporter=verbose
          npm test -- tests/validation-service.test.ts -t "Windows npm|configured Windows|Windows command shim|repository-controlled make.exe" --reporter=verbose

      - name: Windows process supervision
        run: npm test -- tests/windows-process-host.test.ts tests/windows-process-host-protocol.test.ts tests/process-exec.test.ts --reporter=verbose

      - name: HTTP, MCP, and server boundary behavior
        run: npm test -- tests/http-request-cancellation.test.ts tests/tool-handler-validation.test.ts tests/server-network-boundary.test.ts --reporter=verbose

      - name: Validation cancellation and receipt gates
        run: npm test -- tests/validation-service.test.ts -t "cancellation|receipt|supervision|canonical make verify|overlapping validations" --reporter=verbose

      - name: Contract tests
        run: npm test -- tests/tool-contracts.test.ts tests/mcp-contract.test.ts --reporter=verbose

      - name: Windows helper package hygiene
        run: npm test -- tests/package-hygiene.test.ts -t "pins the repository package inventory to its runtime files|requires the Windows process host only for Windows package builds|checks the parent route before treating an absent Windows host as optional" --reporter=verbose

      - name: Lint
        run: npm run lint

      - name: Whitespace check
        run: git diff --check
