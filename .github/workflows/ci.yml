name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify issue-readiness guardrail
        if: matrix.node-version == '20.x'
        run: npm run test:issue-readiness

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Public hygiene
        run: npm run check:public

      - name: Distribution build and health smoke
        run: npm run verify:dist

  windows-test:
    name: "Windows cancellation qualification / Node ${{ matrix.node-version }}"
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Verify issue-readiness guardrail
        if: matrix.node-version == '20.x'
        run: npm run test:issue-readiness

      - name: Typecheck
        run: npm run typecheck

      - name: Build production package and Windows helper
        run: npm run build

      - name: Build Windows fault-injection helper
        run: node scripts/build-windows-process-host.mjs --test

      - name: Verify actual Windows npm package archive
        run: npm run verify:package-archive

      - name: Windows process supervision, contracts, and receipt mutations
        env:
          GPT_REPO_TEST_BUILT_SERVER: '1'
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/package-archive-verification.test.ts
          tests/node-runtime-resolver.test.ts
          tests/windows-process-host.test.ts tests/windows-process-host-protocol.test.ts tests/process-exec.test.ts
          tests/http-request-cancellation.test.ts tests/tool-handler-validation.test.ts tests/server-network-boundary.test.ts
          tests/tool-contracts.test.ts tests/mcp-contract.test.ts tests/validation-receipt-mutations.test.ts
          --reporter=verbose

      - name: Windows trusted dispatch, validation cancellation, and receipts
        run: >-
          node node_modules/vitest/vitest.mjs run tests/validation-service.test.ts
          -t "Windows npm|configured Windows|Windows command shim|repository-controlled make.exe|cancellation|receipt|supervision|canonical make verify|overlapping validations"
          --reporter=verbose

      - name: Windows helper package hygiene
        run: >-
          node node_modules/vitest/vitest.mjs run tests/package-hygiene.test.ts
          -t "pins the repository package inventory to its runtime files|requires the Windows process host only for Windows package builds|checks the parent route before treating an absent Windows host as optional"
          --reporter=verbose

      - name: Lint
        run: npm run lint
